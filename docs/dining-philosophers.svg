<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" width="520" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Dining Philosophers: five philosophers, five forks, one shared table</title>
  <rect x="1" y="1" width="518" height="468" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <!-- table -->
  <circle cx="260" cy="190" r="100" fill="#f6f1e7" stroke="#c9b99a" stroke-width="3"/>
  <text x="260" y="186" text-anchor="middle" font-size="13" fill="#6e5f45">shared table</text>
  <text x="260" y="203" text-anchor="middle" font-size="11" fill="#8a7a5e">1 fork = 1 mutex</text>

  <!-- who holds which fork (P1 eats with F1+F2, P3 eats with F3+F4) -->
  <g stroke="#1a7f37" stroke-width="3" stroke-linecap="round">
    <line x1="260" y1="62" x2="213" y2="125"/>
    <line x1="260" y1="62" x2="307" y2="125"/>
    <line x1="338" y1="296" x2="336" y2="215"/>
    <line x1="338" y1="296" x2="260" y2="270"/>
  </g>

  <!-- forks -->
  <g font-size="11" font-weight="600" text-anchor="middle">
    <rect x="199" y="115" width="28" height="20" rx="5" fill="#1a7f37"/><text x="213" y="129" fill="#ffffff">F1</text>
    <rect x="293" y="115" width="28" height="20" rx="5" fill="#1a7f37"/><text x="307" y="129" fill="#ffffff">F2</text>
    <rect x="322" y="205" width="28" height="20" rx="5" fill="#1a7f37"/><text x="336" y="219" fill="#ffffff">F3</text>
    <rect x="246" y="260" width="28" height="20" rx="5" fill="#1a7f37"/><text x="260" y="274" fill="#ffffff">F4</text>
    <rect x="170" y="205" width="28" height="20" rx="5" fill="#8c959f"/><text x="184" y="219" fill="#ffffff">F5</text>
  </g>

  <!-- philosophers -->
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">
    <circle cx="260" cy="40" r="24" fill="#1a7f37"/><text x="260" y="45">P1</text>
    <circle cx="403" cy="144" r="24" fill="#0969da"/><text x="403" y="149">P2</text>
    <circle cx="348" cy="311" r="24" fill="#1a7f37"/><text x="348" y="316">P3</text>
    <circle cx="172" cy="311" r="24" fill="#8250df"/><text x="172" y="316">P4</text>
    <circle cx="117" cy="144" r="24" fill="#0969da"/><text x="117" y="149">P5</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#57606a">
    <text x="318" y="36">eating</text>
    <text x="403" y="184">thinking</text>
    <text x="348" y="351">eating</text>
    <text x="172" y="351">sleeping</text>
    <text x="117" y="184">thinking</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#1f2328">
    <circle cx="40" cy="388" r="7" fill="#1a7f37"/><text x="54" y="392">eating (holds 2 forks)</text>
    <circle cx="214" cy="388" r="7" fill="#8250df"/><text x="228" y="392">sleeping</text>
    <circle cx="310" cy="388" r="7" fill="#0969da"/><text x="324" y="392">thinking</text>
    <rect x="398" y="381" width="14" height="14" rx="3" fill="#8c959f"/><text x="418" y="392">free fork</text>
  </g>
  <rect x="24" y="410" width="472" height="44" rx="8" fill="#fff1f0" stroke="#cf222e"/>
  <text x="260" y="428" text-anchor="middle" font-size="12" font-weight="700" fill="#cf222e">Death: now − last_meal ≥ time_to_die  →  print "died", stop simulation</text>
  <text x="260" y="445" text-anchor="middle" font-size="11" fill="#57606a">checked continuously by a separate monitor thread</text>
</svg>
